# Camera configuration for H2103d Northampton 4-camera ROV rig
# All images 3840x2160 (16:9)
#
# Format: prefix;camera_model;focal_mm;sensor_width_mm
# focal_px is computed as: focal_mm * image_width_px / sensor_width_mm
#
# Distortion parameters are initialized to zero and refined by bundle adjustment.

# Canon 16-35mm f/2.8 L III at 16mm — heavy barrel distortion at wide end
camlower;OPENCV;16;36

# Canon 8-12mm f/4 at 12mm — full-frame fisheye
cammid;OPENCV_FISHEYE;12;36

# Canon 8-12mm f/4 at 12mm — full-frame fisheye
camupper;OPENCV_FISHEYE;12;36

# HERC video ~24mm equivalent (35mm equiv → ~16.4mm physical on APS-C-ish sensor)
HERC;OPENCV;24;36
